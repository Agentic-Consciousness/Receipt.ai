name: Verify

# Backend tests and the frontend production build.
# pull_request runs the workflow file from the pull request, including forks, so an
# outsider can change it. These jobs stay on GitHub-hosted runners. A self-hosted
# runner would execute that untrusted code on a private machine.
# Nothing deploys and no secrets are used.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        # The verify script requires the same Python the backend image uses.
        # ubuntu-latest does not provide 3.11.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run the backend tests
        run: bash .github/scripts/verify-backend.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        # The verify script requires the Node major version the frontend image uses.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Build the frontend
        run: bash .github/scripts/verify-frontend.sh
