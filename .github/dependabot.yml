version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/worker"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Odd-numbered Node releases never become LTS.
      - dependency-name: "node"
        versions: ["21.x", "23.x", "25.x", "27.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Held migrations: each needs its own planned change, not a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"] # TypeScript 7

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Major API changes held for a planned migration.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-asyncio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]
